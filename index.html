<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khủng Long Tool - Tải File Mods</title>
    <style>
        /* CSS Giao diện Gaming Dark Mode */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; line-height: 1.6; padding-bottom: 50px; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .header h1 { color: #00ff88; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .header p { color: #aaa; font-size: 1rem; margin-top: 5px; }

        /* Thông báo mua bán */
        .notice-box { background: rgba(255, 170, 0, 0.1); border-left: 4px solid #ffaa00; padding: 15px; margin-bottom: 30px; border-radius: 4px; font-size: 0.95rem; }
        
        /* Grid cho 4 nút */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        /* Card Từng Nút */
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-color: #00ff88; }
        .card h2 { color: #fff; font-size: 1.4rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .card .info { font-size: 0.9rem; color: #ccc; margin-bottom: 8px; }
        .card .info strong { color: #fff; }
        
        /* Nút Lấy Link */
        .btn-get { display: block; width: 100%; text-align: center; background: linear-gradient(45deg, #00b09b, #96c93d); color: #fff; padding: 12px; margin-top: 20px; text-decoration: none; font-weight: bold; border-radius: 6px; text-transform: uppercase; border: none; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
        .btn-get:hover { opacity: 0.9; }
        .btn-get:disabled { background: #555; cursor: not-allowed; color: #888; }

        /* Footer Mạng xã hội */
        .footer { margin-top: 40px; text-align: center; }
        .social-btn { display: inline-block; padding: 10px 20px; margin: 5px; border-radius: 5px; text-decoration: none; color: #fff; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .btn-yt { background: #ff0000; }
        .btn-yt:hover { background: #cc0000; }
        .btn-tele { background: #0088cc; }
        .btn-tele:hover { background: #006699; }

        /* Popup hiển thị link gốc sau khi vượt thành công */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; border: 2px solid #00ff88; padding: 30px; border-radius: 12px; max-width: 90%; width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0,255,136,0.2); }
        .modal-content h3 { color: #00ff88; margin-bottom: 15px; font-size: 1.5rem; }
        .modal-content p { margin-bottom: 25px; color: #ccc; }
        .btn-download { display: inline-block; background: #00ff88; color: #000; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 5px; font-size: 1.1rem; }
        .btn-download:hover { background: #00cc6a; }
        .close-modal { margin-top: 20px; display: block; color: #888; text-decoration: underline; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Khủng Long Tool</h1>
            <p>Chia sẻ Mods & Fix Lag an toàn, mượt mà</p>
        </div>

        <div class="notice-box" id="noticeBox">
            <!-- Sẽ tự động lấy text từ config.js điền vào đây -->
        </div>

        <div class="grid" id="cardContainer">
            <!-- Các nút bấm sẽ tự động sinh ra tại đây nhờ main.js -->
        </div>

        <div class="footer">
            <a href="#" id="ytLink" target="_blank" class="social-btn btn-yt">📺 Kênh Youtube</a>
            <a href="#" id="teleGroupLink" target="_blank" class="social-btn btn-tele">✈️ Box Telegram</a>
            <a href="#" id="teleAdminLink" target="_blank" class="social-btn btn-tele">💬 Liên hệ Admin</a>
        </div>
    </div>

    <!-- Popup hiện link Drive sau khi vượt xong -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h3>🎉 Vượt Link Thành Công!</h3>
            <p>Cảm ơn bạn đã ủng hộ. Bấm nút bên dưới để vào trang tải file của bạn.</p>
            <a href="#" id="finalDownloadLink" target="_blank" class="btn-download">TẢI FILE NGAY</a>
            <span class="close-modal" onclick="document.getElementById('successModal').style.display='none'">Đóng cửa sổ này</span>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>
</html>
